# Motion configuration for the robot. Reference: https://motion-project.github.io/motion_config.html
# Motion detects *that* something moved; the brain (robot/) figures out *what* it was.

daemon off
setup_mode off
log_level 6

# ---- Camera ----
video_device /dev/video0
width 640
height 480
framerate 10

# ---- Detection ----
# Changed pixels needed to count as motion (640x480 = 307200 pixels, so ~1%).
threshold 3000
noise_tune on
despeckle_filter EedDl
# Ignore flickers shorter than this many frames.
minimum_motion_frames 3
# Seconds of stillness that end an event.
event_gap 10

# ---- Output: one snapshot per event, no movies ----
# "first" reacts quickly; "best" picks the frame with the most motion but only
# saves it once the event ends (event_gap seconds later).
picture_output first
picture_quality 85
picture_filename %Y%m%d-%H%M%S-%v
target_dir /data/snapshots
movie_output off

# Hand the snapshot to the brain.
on_picture_save /app/scripts/motion_hook.sh %v %f

# ---- Web UI and live stream (handy for aiming the camera) ----
webcontrol_port 8080
webcontrol_localhost off
stream_port 8081
stream_localhost off
